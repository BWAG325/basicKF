# 统一参数调参：每个模型在所有工况上用同一组参数，选平均 RMSE 最小
scenarios:
  - {name: shuttle,          path: configs/sim/rm_shuttle.yaml,          duration: 16}
  - {name: shuttle_spin,     path: configs/sim/rm_shuttle_spin.yaml,     duration: 16}
  - {name: ellipse_spin,     path: configs/sim/rm_ellipse_spin.yaml,     duration: 16}
  - {name: ellipse_var_spin, path: configs/sim/rm_ellipse_var_spin.yaml, duration: 16}
  - {name: cruise_spin,      path: configs/sim/rm_cruise_spin.yaml,      duration: 8}
  - {name: cruise_var_spin,  path: configs/sim/rm_cruise_var_spin.yaml,  duration: 12}

warmup: 25
measurement_sigma: 0.02
objective: mean          # mean / max

grids:
  cv:       [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50]
  ca_jerk:  [5, 10, 20, 50, 100, 200]
  cj_snap:  [50, 100, 200, 500, 1000, 2000]
  cv_slow:  [0.01, 0.02, 0.03, 0.05, 0.1, 0.2, 0.5, 1.0]
  cv_fast:  [2, 5, 10, 20, 50]
  cv9:      [0.01, 0.02, 0.03, 0.05, 0.1, 0.2, 0.5]
  ca_slow:  [0.05, 0.1, 0.2, 0.5, 1, 2, 5]
  ca_fast:  [10, 20, 50, 100]
  # CT / SPIN（EKF）
  ct_v:     [0.5, 1, 2, 5]
  ct_w:     [0.5, 1, 2, 5]
  ct_a:     [2, 5, 10]
  ct_alpha: [2, 5, 10]
  ct_j:     [20, 50, 100]
  spin_v:   [0.5, 1, 2, 5]
  spin_w:   [0.5, 1, 2, 5]
  spin_alpha: [2, 5, 10]

output:
  json: build/kf/tune_result.json
