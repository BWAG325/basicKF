# S 形绕行：加速 → 左弧 → 右弧 → 左弧 → 刹车（用于轨迹对比）

sim:
  min_dt: 0.001

robot:
  armors: 4
  armor_radius: 0.22
  armor_dz: 0.0
  armor_width: 0.13
  armor_height: 0.12
  body_radius: 0.30

initial:
  position: [0.0, 0.0, 0.18]
  velocity: [0.0, 0.0, 0.0]
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  spin_phase: 0.0

plan:
  - {duration: 0.4}
  - {duration: 1.0, accel: 2.0}
  - {duration: 0.7, turn_rate: 1.6}
  - {duration: 1.4, turn_rate: -1.6}
  - {duration: 0.7, turn_rate: 1.6}
  - {duration: 0.4, accel: -5.0}

sensor:
  schedule:
    t0: 0.0
    interval: 0.04
    jitter: 0.015
  seed: 33
  position_sigma: [0.01, 0.01, 0.01]
  normal_sigma: 0.01
  dropout: 0.02
  max_range: 20.0
  facing_min_cos: 0.2
  camera:
    enabled: true
    position: [3.0, -6.0, 2.5]
    target: [1.0, 0.0, 0.2]
    fov_half_deg: 45.0
    output_in_camera_frame: false
