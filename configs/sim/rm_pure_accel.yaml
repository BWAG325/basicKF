# 诊断用：纯 5 m/s² 匀加速，无小陀螺；CA 应该明显优于 CV
sim: {min_dt: 0.001}
robot:
  armors: 4
  armor_radius: 0.22
  armor_dz: 0.0
  armor_width: 0.13
  armor_height: 0.12
  body_radius: 0.30
initial:
  position: [0.0, 0.0, 0.18]
  velocity: [0.0, 0.0, 0.0]
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  spin_phase: 0.0
plan:
  - {duration: 2.0, accel: 5.0}
  - {duration: 2.0}
sensor:
  schedule: {t0: 0.0, interval: 0.0125, jitter: 0.002}
  seed: 31
  position_sigma: [0.02, 0.02, 0.02]
  normal_sigma: 0.01
  dropout: 0.02
  max_range: 40.0
  facing_min_cos: 0.2
  camera:
    enabled: true
    position: [2.0, -12.0, 4.0]
    target: [2.0, 0.0, 0.2]
    fov_half_deg: 65.0
    output_in_camera_frame: false
