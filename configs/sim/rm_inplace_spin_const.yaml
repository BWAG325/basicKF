# 实际工况 B：原地小幅度移动 + 匀速小陀螺（6 rad/s）
sim: {min_dt: 0.001}
robot:
  armors: 4
  armor_radius: 0.22
  armor_dz: 0.0
  armor_width: 0.13
  armor_height: 0.12
  body_radius: 0.30
initial:
  position: [0.0, 0.0, 0.18]
  velocity: [0.0, 0.0, 0.0]
  yaw: 0.0
  pitch: 0.0
  roll: 0.0
  spin_phase: 0.0
plan:
  - {duration: 1.0, spin_rate: 6.0}
  - {duration: 0.4, accel: 0.3, spin_rate: 6.0}
  - {duration: 0.4, accel: -0.3, spin_rate: 6.0}
  - {duration: 1.0, spin_rate: 6.0}
  - {duration: 0.4, accel: -0.3, spin_rate: 6.0}
  - {duration: 0.4, accel: 0.3, spin_rate: 6.0}
  - {duration: 1.0, spin_rate: 6.0}
  - {duration: 0.4, accel: 0.3, spin_rate: 6.0}
  - {duration: 0.4, accel: -0.3, spin_rate: 6.0}
  - {duration: 1.0, spin_rate: 6.0}
sensor:
  schedule: {t0: 0.0, interval: 0.0125, jitter: 0.002}
  seed: 22
  position_sigma: [0.02, 0.02, 0.02]
  normal_sigma: 0.01
  dropout: 0.02
  max_range: 40.0
  facing_min_cos: 0.2
  camera:
    enabled: true
    position: [2.0, -12.0, 4.0]
    target: [2.0, 0.0, 0.2]
    fov_half_deg: 65.0
    output_in_camera_frame: false
