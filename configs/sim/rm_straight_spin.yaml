# RM 车运动：起步 → 匀速小陀螺 → 边跑边转 → 刹停
# 每段控制量在 duration 内保持恒定：accel / turn_rate / spin_rate

sim:
  min_dt: 0.001        # 仿真器最小时间分辨率 [s]

robot:
  armors: 4
  armor_radius: 0.22        # 板中心到旋转轴的距离 [m]（占位值，按车型改）
  armor_dz: 0.0             # 板中心相对 chassis.p.z [m]
  armor_width: 0.13
  armor_height: 0.12
  body_radius: 0.30

initial:
  position: [0.0, 0.0, 0.18]
  velocity: [0.0, 0.0, 0.0]
  yaw: 0.0                  # 车头偏航 [rad]
  pitch: 0.0
  roll: 0.0
  spin_phase: 0.0

plan:
  - {duration: 0.5}                        # 静止
  - {duration: 1.0, accel: 2.5}            # 0 → 2.5 m/s
  - {duration: 1.8, angular_rate: [0.0, 0.0, 9.0]}  # 匀速 + 小陀螺（整车绕 z 转）
  - {duration: 1.2, turn_rate: 1.2}        # 边跑边左转
  - {duration: 0.5, accel: -2.0, jerk: -12.0} # 刹车：负加速度随时间增大，正好 0.5s 停住

sensor:
  schedule:
    t0: 0.0
    interval: 0.04      # 名义帧间隔 [s]
    jitter: 0.015       # 每帧 ±抖动，模拟实车非均匀观测
  seed: 42
  position_sigma: [0.01, 0.01, 0.01]   # 先按对称高斯占位，PnP 误差特性后续再替换
  normal_sigma: 0.01
  dropout: 0.02
  max_range: 20.0
  facing_min_cos: 0.2
  camera:
    enabled: true
    position: [2.0, -8.0, 2.5]
    target: [2.5, 0.0, 0.2]
    fov_half_deg: 40.0
    output_in_camera_frame: false
